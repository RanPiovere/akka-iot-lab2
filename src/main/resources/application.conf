akka {
  loglevel = "INFO"
  actor.provider = local
}

iot {
  profile = "standard"
  profile = ${?IOT_PROFILE}

  profiles {
    standard {
      cluster-enabled = false
      description = "Single-node IoT ingestion service"
    }
    cluster {
      cluster-enabled = true
      description = "Cluster-compatible IoT ingestion service"
    }
  }
}
